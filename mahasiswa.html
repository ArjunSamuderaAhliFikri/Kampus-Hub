<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Kampus Hub</title>
  </head>
  <body>
    <div class="container">
      <nav class="nav">
        <div class="header">
          <h1>Kampus Hub</h1>
          <p>Papan Universitas Wahidiyah</p>
        </div>

        <ul class="menubar">
          <li><a href="/mahasiswa">Mahasiswa</a></li>
          <li><a href="#tentang">Tentang</a></li>
          <li><a href="#pengumuman%baru">Pengumuman Baru</a></li>
        </ul>
      </nav>

      <main>
        <section class="announcement">
          <p id="announcement-header">Pengumuman Terbaru</p>
          <div class="search-wrapper">
            <label for="search-colleges">Cari Mahasiswa</label>
            <input
              type="text"
              name="search-colleges"
              id="search-colleges"
              placeholder="Cari Mahasiswa"
            />
          </div>
        </section>

        <section class="wrapper-data-college">
          <section class="detail-profile-college">
            <div class="wrapper-profile-image">
              <img src="./default-profile.jpg" alt="" />
            </div>
            <h1 class="detail-name-college">Arjun Samudera Ahli Fikri</h1>
            <p class="description-college">
              Teknik Informatika | Umur : 20 | IPK : 4.0
            </p>
          </section>
          <section class="announcement-list"></section>
        </section>
        <footer>
          <section id="about-apps">
            <h1>Tentang Aplikasi Ini</h1>
          </section>
          <p class="info-footer">
            Pemrograman Web - 2026 - Arjun Samudera Ahli Fikri - 20252210170
          </p>
        </footer>
      </main>
    </div>
    <script src="./data.js"></script>
    <script src="./colleges.js"></script>
  </body>
</html>
